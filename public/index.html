<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CIVIS AI - Redirecting...</title>
    <!-- Supabase CDN needed for app.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/app.js"></script>
    <script>
        checkAuthSession().then(user => {
            if (!user) {
                window.location.replace("/login.html");
            } else if (isAdminUser()) {
                window.location.replace("/admin/admin_dashboard.html");
            } else {
                window.location.replace("/user/index.html");
            }
        }).catch(err => {
            console.error("Auth redirect failed:", err);
            window.location.replace("/login.html");
        });
    </script>
</head>
<body>
    <div style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f7f9fb; color: #004ac6; font-size: 1.2rem; font-weight: bold;">
        Redirecting to CIVIS AI...
    </div>
</body>
</html>
